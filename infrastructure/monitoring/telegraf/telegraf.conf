# Telegraf Configuration for Plutopus Network Ingest

[global_tags]

[agent]
  interval = "10s"
  round_interval = true
  metric_batch_size = 1000
  metric_buffer_limit = 10000
  collection_jitter = "0s"
  flush_interval = "10s"
  flush_jitter = "0s"
  precision = "0s"
  hostname = "telegraf-collector"
  omit_hostname = false

# ==========================================
# OUTPUTS
# ==========================================

# Publish metrics to Redpanda raw topic
[[outputs.kafka]]
  brokers = ["redpanda:9092"]
  topic = "metrics_raw"
  data_format = "json"
  json_timestamp_units = "1s"

# ==========================================
# INPUTS (Simulated & Production Examples)
# ==========================================

# Syslog Input Server for events
[[inputs.syslog]]
  server = "tcp://:6514"
  path = "/var/log/syslog"

# SNMP Client Mock configuration for Device Telemetry
[[inputs.snmp]]
  agents = ["10.0.0.1:161", "10.1.0.1:161", "10.2.0.1:161", "10.3.0.1:161"]
  version = 2
  community = "public"
  interval = "15s"

  # System info
  [[inputs.snmp.field]]
    name = "sysName"
    oid = "RFC1213-MIB::sysName.0"
    is_tag = true

  # Interface table statistics
  [[inputs.snmp.table]]
    name = "interface"
    inherit_tags = [ "sysName" ]
    oid = "IF-MIB::ifTable"

    [[inputs.snmp.table.field]]
      name = "ifDescr"
      oid = "IF-MIB::ifDescr"
      is_tag = true

    [[inputs.snmp.table.field]]
      name = "ifHCInOctets"
      oid = "IF-MIB::ifHCInOctets"

    [[inputs.snmp.table.field]]
      name = "ifHCOutOctets"
      oid = "IF-MIB::ifHCOutOctets"
