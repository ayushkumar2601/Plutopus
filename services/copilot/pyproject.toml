[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "plutopus-copilot"
version = "0.1.0"
description = "AI Copilot Engine for Plutopus"
requires-python = ">=3.9"
dependencies = [
    "sqlalchemy>=2.0.0",
    "pydantic>=2.0.0",
    "plutopus-schemas",
    "plutopus-shared"
]

[tool.setuptools.packages.find]
where = ["."]
