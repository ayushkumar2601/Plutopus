[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "plutopus-schemas"
version = "0.1.0"
description = "Shared schemas for Plutopus"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]
