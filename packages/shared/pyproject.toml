[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "plutopus-shared"
version = "0.1.0"
description = "Shared database logic and models for Plutopus"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.0",
    "psycopg2-binary>=2.9.0",
    "pydantic>=2.0.0"
]

[tool.setuptools.packages.find]
where = ["src"]
