[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "plutopus-cli"
version = "0.1.0"
description = "Typer CLI for Plutopus"
requires-python = ">=3.9"
dependencies = [
    "typer[all]>=0.9.0",
    "requests>=2.31.0",
    "plutopus-schemas"
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
plutopus = "main:app"
